name: BTM build

on:
  push:
    branches: [ multi ]
  pull_request:
    branches: [ multi ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew fusejars
      - name: Stop gradle daemon
        run: ./gradlew --stop
      - name: Copy jars
        run: cp ./**/build/libs/BetterThanMending*.jar .
      - uses: actions/upload-artifact@v4
        with:
          name: BTM Jars
          path: ./*.jar